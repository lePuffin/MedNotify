blueprint:
  name: "💊 Medication Notification"
  description: |
    <h3>💊 Medication Notification <code>v1.1.0</code></h3>
    🔗<a href="https://github.com/lePuffin/MedNotify"> Github Link</a>
    <hr>

    <b>Features:</b>
    - Fixed-time medication schedule.
    - Device picker target selection.
    - Notification Group ID override.
    - Actionable Taken button.
    - Optional timeout flow.
    - Optional helper/action hooks.

  domain: automation
  source_url: https://raw.githubusercontent.com/lePuffin/MedNotify/main/blueprints/automation/mednotify/mednotify_v100.yaml
  input:
    section_pill:
      name: "💊 Pill Appointment"
      description: 'Medication schedule setup.'
      collapsed: true
      input:
        person:
          name: Person
          description: |
            Pick a Home Assistant person entity or type a custom name.
            The choice label below tells the blueprint which input to use.

            <b>Example:</b> Joana
          selector:
            choose:
              choices:
                description: Use Home Assistant person entity or type a custom name.
                Person Entity:
                  selector:
                    entity:
                      filter:
                        - domain: person
                Custom Name:
                  selector:
                    text:

        medication:
          name: Medication
          description: |
            Medication name.

            <b>Example:</b> Amoxicillin
          selector:
            text:

        dose:
          name: Dose
          description: |
            Dose or instructions shown in the notification.

            <b>Example:</b> 1 capsule after meal
          selector:
            text:

        start_datetime:
          name: Start date and time
          description: |
            Date/time of the first reminder.

            <b>Example:</b> 2026-08-10 08:00
          selector:
            datetime:

        frequency:
          name: Frequency
          description: |
            Interval between reminders.
            If set to 0d 0h 0m 0s, reminders are sent once per day.

            <b>Example:</b> 8 hours.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        schedule_end:
          name: Schedule end
          description: |
            Pick forever or set a duration limit. The duration field only appears when needed.
          default: Forever
          selector:
            choose:
              choices:
                Forever:
                  selector:
                    select:
                      options:
                        - Forever
                For a duration:
                  selector:
                    duration:
                      enable_day: true
                      enable_second: false

    section_notifications:
      name: "📲 Notifications"
      description: >-
        Delivery and mobile-platform options.
      collapsed: true
      input:
        notify_devices:
          name: Device to Notify
          description: |
            Device target for notifications.
            Pick one or more mobile app devices from the dropdown.

            <b>Example:</b> Alex iPhone, Pixel 9
          selector:
            device:
              filter:
              - integration: mobile_app
              multiple: false

        notify_group_id:
          name: Notification Group ID
          description: |
            If set, this overrides Device to Notify.
            Enter only the group id (without notify.).

            <b>Example:</b> family_phones
            `Optional`
          default: ""
          selector:
            text:

        title:
          name: Notification title
          description: |
            Main title shown in the reminder.

            <b>Example:</b> Medication Reminder
          default: Medication Reminder
          selector:
            text:

        taken_label:
          name: Taken button label
          description: |
            Label used by the action button.
            <b>Example:</b> Taken
          default: Taken
          selector:
            text:

        timeout:
          name: Timeout duration
          description: |
            Use 00:00:00 to disable timeout handling.

            <b>Example:</b> 1 hour
            `Optional`
          default:
            hours: 1
            minutes: 0
            seconds: 0
          selector:
            duration:

        notification_platform:
          name: Notification platform
          description: |
            Choose Android or iOS to show the matching platform fields.
          selector:
            choose:
              choices:
                Android:
                  selector:
                    object:
                      fields:
                        android_channel:
                          label: Android channel
                          required: false
                          selector:
                            text:

                        android_priority:
                          label: Android priority
                          required: false
                          selector:
                            select:
                              custom_value: true
                              options:
                                - ""
                                - high
                                - normal

                        android_ttl:
                          label: Android TTL in seconds
                          required: false
                          selector:
                            text:

                        android_sticky:
                          label: Android sticky
                          required: false
                          selector:
                            boolean:

                        android_persistent:
                          label: Android persistent
                          required: false
                          selector:
                            boolean:

                iOS:
                  selector:
                    object:
                      fields:
                        ios_interruption_level:
                          label: iOS interruption level
                          required: false
                          selector:
                            select:
                              custom_value: true
                              options:
                                - ""
                                - passive
                                - active
                                - time-sensitive
                                - critical

                        ios_sound:
                          label: iOS sound
                          required: false
                          selector:
                            text:

    section_helpers:
      name: "🧩 Helpers (optional)"
      description: >-
        User-managed helper or action hooks.
      collapsed: true
      input:
        acknowledgement_actions:
          name: Acknowledgement actions
          description: |
            Runs when Taken is pressed.

            Example action:
              ```yaml
              service: input_text.set_value
              target:
                entity_id: input_text.mednotify_ack_history
              data:
                value: >-
                  {% set timestamp = now().strftime('%Y-%m-%d %H:%M') %}
                  {{ timestamp }} | {{ person_name }} took {{ in_dose }} of {{ in_medication }}
              ```
            `Optional`
          default: []
          selector:
            action: {}

        timeout_actions:
          name: Timeout actions
          description: |
            Runs when timeout is reached.

            Example action:
              ```yaml
              service: input_text.set_value
              target:
                entity_id: input_text.mednotify_timeout_history
              data:
                value: >-
                  {% set timestamp = now().strftime('%Y-%m-%d %H:%M') %}
                  {{ timestamp }} | Timeout reached for {{ person_name }}'s reminder
              ```
            `Optional`
          default: []
          selector:
            action: {}

mode: parallel
max: 100

trigger:
  - platform: time_pattern
    minutes: "/1"

variables:
  in_person: !input person
  in_medication: !input medication
  in_dose: !input dose
  in_start: !input start_datetime
  in_frequency: !input frequency
  in_schedule_end: !input schedule_end
  in_notify_devices: !input notify_devices
  in_notify_group_id: !input notify_group_id
  in_title: !input title
  in_taken_label: !input taken_label
  in_timeout: !input timeout
  in_notification_platform: !input notification_platform

  person_name: >-
    {% if in_person.active_choice == 'Use Home Assistant person entity' %}
      {{ state_attr(in_person.entity, 'friendly_name') or in_person.entity }}
    {% else %}
      {{ in_person.text }}
    {% endif %}

  notification_platform_choice: >-
    {{ in_notification_platform.active_choice if in_notification_platform is mapping else '' }}

  start_ts: "{{ as_timestamp(in_start) | float(0) }}"
  now_ts: "{{ as_timestamp(now()) | float(0) }}"

  frequency_seconds_raw: >-
    {{
      (in_frequency.days | int(0)) * 86400 +
      (in_frequency.hours | int(0)) * 3600 +
      (in_frequency.minutes | int(0)) * 60 +
      (in_frequency.seconds | int(0))
    }}
  frequency_seconds_effective: "{{ 86400 if (frequency_seconds_raw | int(0)) == 0 else (frequency_seconds_raw | int(0)) }}"

  schedule_end_choice: >-
    {{ in_schedule_end.active_choice if in_schedule_end is mapping else 'Forever' }}

  duration_seconds: >-
    {% if schedule_end_choice == 'For a duration' %}
      {% set duration_value = in_schedule_end['For a duration'] %}
      {{
        (duration_value.days | int(0)) * 86400 +
        (duration_value.hours | int(0)) * 3600 +
        (duration_value.minutes | int(0)) * 60 +
        (duration_value.seconds | int(0))
      }}
    {% else %}
      0
    {% endif %}

  elapsed_seconds: "{{ (now_ts - start_ts) | int(0) }}"

  is_in_window: >-
    {{
      (elapsed_seconds | int(0)) >= 0 and
      (
        (schedule_end_choice == 'Forever') or
        ((elapsed_seconds | int(0)) <= (duration_seconds | int(0)))
      )
    }}

  is_due_now: >-
    {{
      (elapsed_seconds | int(0)) >= 0 and
      ((elapsed_seconds | int(0)) % (frequency_seconds_effective | int(1)) < 60)
    }}

condition:
  - condition: template
    value_template: "{{ is_in_window and is_due_now }}"

action:
  - variables:
      scheduled_ts: >-
        {{
          (start_ts | int(0)) +
          (((elapsed_seconds | int(0)) // (frequency_seconds_effective | int(1))) * (frequency_seconds_effective | int(1)))
        }}
      scheduled_label: "{{ scheduled_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
      notification_tag: >-
        mednotify_{{ this.entity_id | replace('.', '_') }}_{{ (scheduled_ts | int(0)) }}
      action_taken: >-
        MEDNOTIFY_TAKEN_{{ this.entity_id | replace('.', '_') }}_{{ (scheduled_ts | int(0)) }}
      timeout_seconds: >-
        {{
          (in_timeout.days | int(0)) * 86400 +
          (in_timeout.hours | int(0)) * 3600 +
          (in_timeout.minutes | int(0)) * 60 +
          (in_timeout.seconds | int(0))
        }}
      timeout_active: "{{ (timeout_seconds | int(0)) > 0 }}"
      notification_data_payload: >-
        {% set payload = {
          'tag': notification_tag,
          'group': 'mednotify',
          'actions': [{'action': action_taken, 'title': in_taken_label}]
        } %}
        {% if notification_platform_choice == 'Android' %}
          {% set android = in_notification_platform[notification_platform_choice] %}
          {% set payload = dict(payload, sticky=android.android_sticky, persistent=android.android_persistent) %}
          {% if (android.android_channel | string | trim) != '' %}
            {% set payload = dict(payload, channel=(android.android_channel | string | trim)) %}
          {% endif %}
          {% if (android.android_priority | string | trim) != '' %}
            {% set payload = dict(payload, priority=(android.android_priority | string | trim)) %}
          {% endif %}
          {% if (android.android_ttl | string | trim) != '' %}
            {% set payload = dict(payload, ttl=(android.android_ttl | int(0))) %}
          {% endif %}
        {% elif notification_platform_choice == 'iOS' %}
          {% set ios = in_notification_platform[notification_platform_choice] %}
          {% set push = {} %}
          {% if (ios.ios_interruption_level | string | trim) != '' %}
            {% set push = dict(push, interruption_level=(ios.ios_interruption_level | string | trim)) %}
          {% endif %}
          {% if (ios.ios_sound | string | trim) != '' %}
            {% set push = dict(push, sound=(ios.ios_sound | string | trim)) %}
          {% endif %}
          {% if push | length > 0 %}
            {% set payload = dict(payload, push=push) %}
          {% endif %}
        {% endif %}
        {{ payload | to_json }}
      message_body: >-
        Person: {{ person_name }}
        Medication: {{ in_medication }}
        Dose: {{ in_dose }}
        Scheduled: {{ scheduled_label }}

  - condition: template
    value_template: >-
      {{
        (in_notify_group_id | string | trim) != '' or
        (
          in_notify_devices.device_id is defined and
          (in_notify_devices.device_id | count > 0)
        )
      }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
        sequence:
          - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
            continue_on_error: true
            data:
              title: "{{ in_title }}"
              message: "{{ message_body }}"
              data: "{{ notification_data_payload | from_json }}"
    default:
      - action: notify.notify
        continue_on_error: true
        target: !input notify_devices
        data:
          title: "{{ in_title }}"
          message: "{{ message_body }}"
          data: "{{ notification_data_payload | from_json }}"

  - choose:
      - conditions:
          - condition: template
        value_template: "{{ timeout_active | bool(false) }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_taken }}"
            timeout:
              seconds: "{{ timeout_seconds | int(0) }}"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is not none }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
                        sequence:
                          - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
                            continue_on_error: true
                            data:
                              message: clear_notification
                              data:
                                tag: "{{ notification_tag }}"
                    default:
                      - action: notify.notify
                        continue_on_error: true
                        target: !input notify_devices
                        data:
                          message: clear_notification
                          data:
                            tag: "{{ notification_tag }}"
                  - sequence: !input acknowledgement_actions
            default:
              - sequence: !input timeout_actions
    default:
      - wait_for_trigger:
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_taken }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
            sequence:
              - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
                continue_on_error: true
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"
        default:
          - action: notify.notify
            continue_on_error: true
            target: !input notify_devices
            data:
              message: clear_notification
              data:
                tag: "{{ notification_tag }}"
      - sequence: !input acknowledgement_actions
