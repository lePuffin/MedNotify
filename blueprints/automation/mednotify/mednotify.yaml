blueprint:
  name: "💊 Medication Notification"
  description: |
    <h3>💊 Medication Notification <code>v0.1.0</code></h3>
    🔗<a href="https://github.com/lePuffin/MedNotify"> Github Link</a>
    <hr>

    <b>Features:</b>
    - Fixed-time medication schedule.
    - Device picker target selection.
    - Notification Group ID override.
    - Actionable Taken button.
    - Optional timeout flow.
    - Optional helper/action hooks.

  domain: automation
  source_url: https://raw.githubusercontent.com/lePuffin/MedNotify/main/blueprints/automation/mednotify/mednotify_v100.yaml
  input:
    section_pill:
      name: "💊 Pill Appointment"
      description: 'Medication schedule setup.'
      collapsed: true
      input:
        person:
          name: Person
          description: |
            Name of the person taking the medication.

            Example: Alex
          selector:
            text:

        medication:
          name: Medication
          description: |
            Medication name.

            Example: Amoxicillin
          selector:
            text:

        dose:
          name: Dose
          description: |
            Dose or instructions shown in the notification.

            Example: 1 capsule after meal
          selector:
            text:

        start_datetime:
          name: Start date and time
          description: |
            Date/time of the first reminder.

            Example: 2026-08-10 08:00
          selector:
            datetime:

        frequency:
          name: Frequency
          description: |
            Interval between reminders.
            If set to 0d 0h 0m 0s, reminders are sent once per day.

            Example: 8 hours.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        run_forever:
          name: Run forever
          description: 'If enabled, reminders continue indefinitely.'
          default: true
          selector:
            boolean:

        duration:
          name: Duration (used only when Run forever is off)
          description: |
            Value 0 is valid and means only at start time.

            Example: 3 days.
          default:
            days: 3
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

    section_notifications:
      name: "📲 Notifications"
      description: >-
        Delivery and mobile-platform options.
      collapsed: true
      input:
        notify_devices:
          name: Device to Notify
          description: |
            Device target for notifications.
            Pick one or more mobile app devices from the dropdown.

            Example: Alex iPhone, Pixel 9
          selector:
            device:
              filter:
              - integration: mobile_app
              multiple: false

        notify_group_id:
          name: Notification Group ID
          description: |
            If set, this overrides Device to Notify.
            Enter only the group id (without notify.).

            Example: family_phones
            `Optional`
          default: ""
          selector:
            text:

        title:
          name: Notification title
          description: |
            Main title shown in the reminder.

            Example: Medication Reminder
          default: Medication Reminder
          selector:
            text:

        taken_label:
          name: Taken button label
          description: |
            Label used by the action button.
            Example: Taken
          default: Taken
          selector:
            text:

        timeout:
          name: Timeout duration
          description: |
            Use 00:00:00 to disable timeout handling.

            Example: 1 hour
            `Optional`
          default:
            hours: 1
            minutes: 0
            seconds: 0
          selector:
            duration:

        android_channel:
          name: Android channel
          description: |
            Android notification channel.

            Example: medication_alerts
            `Optional`
          default: ""
          selector:
            text:

        android_priority:
          name: Android priority
          description: |
            Android push priority.

            Example: high
            `Optional`
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - ""
                - high
                - normal

        android_ttl:
          name: Android TTL in seconds
          description: |
            Time to live for Android push.

            Example: 0
            `Optional`
          default: ""
          selector:
            text:

        android_sticky:
          name: Android sticky
          description: |
            Keep notification visible until interaction.

            `Optional`
          default: true
          selector:
            boolean:

        android_persistent:
          name: Android persistent
          description: |
            Persist notification on device.

            `Optional`
          default: true
          selector:
            boolean:

        ios_interruption_level:
          name: iOS interruption level
          description: |
            iOS push interruption level.

            Example: time-sensitive
            `Optional`
          default: ""
          selector:
            select:
              custom_value: true
              options:
                - ""
                - passive
                - active
                - time-sensitive
                - critical

        ios_sound:
          name: iOS sound
          description: |
            iOS notification sound file.

            Example: default
            `Optional`
          default: ""
          selector:
            text:

    section_helpers:
      name: "🧩 Helpers (optional)"
      description: >-
        User-managed helper or action hooks.
      collapsed: true
      input:
        acknowledgement_actions:
          name: Acknowledgement actions
          description: |
            Runs when Taken is pressed.

            Example action:
              ```yaml
              service: input_text.set_value
              target:
                entity_id: input_text.mednotify_ack_history
              data:
                value: >-
                  {% set timestamp = now().strftime('%Y-%m-%d %H:%M') %}
                  {{ timestamp }} | {{ in_person }} took {{ in_dose }} of {{ in_medication }}
              ```
            `Optional`
          default: []
          selector:
            action: {}

        timeout_actions:
          name: Timeout actions
          description: |
            Runs when timeout is reached.

            Example action:
              ```yaml
              service: input_text.set_value
              target:
                entity_id: input_text.mednotify_timeout_history
              data:
                value: >-
                  {% set timestamp = now().strftime('%Y-%m-%d %H:%M') %}
                  {{ timestamp }} | Timeout reached for {{ in_person }}'s reminder
              ```
            `Optional`
          default: []
          selector:
            action: {}

mode: parallel
max: 100

trigger:
  - platform: time_pattern
    minutes: "/1"

variables:
  in_person: !input person
  in_medication: !input medication
  in_dose: !input dose
  in_start: !input start_datetime
  in_frequency: !input frequency
  in_run_forever: !input run_forever
  in_duration: !input duration
  in_notify_devices: !input notify_devices
  in_notify_group_id: !input notify_group_id
  in_title: !input title
  in_taken_label: !input taken_label
  in_timeout: !input timeout
  in_android_channel: !input android_channel
  in_android_priority: !input android_priority
  in_android_ttl: !input android_ttl
  in_android_sticky: !input android_sticky
  in_android_persistent: !input android_persistent
  in_ios_interruption_level: !input ios_interruption_level
  in_ios_sound: !input ios_sound

  start_ts: "{{ as_timestamp(in_start) | float(0) }}"
  now_ts: "{{ as_timestamp(now()) | float(0) }}"

  frequency_seconds_raw: >-
    {{
      (in_frequency.days | int(0)) * 86400 +
      (in_frequency.hours | int(0)) * 3600 +
      (in_frequency.minutes | int(0)) * 60 +
      (in_frequency.seconds | int(0))
    }}
  frequency_seconds_effective: "{{ 86400 if (frequency_seconds_raw | int(0)) == 0 else (frequency_seconds_raw | int(0)) }}"

  duration_seconds: >-
    {{
      (in_duration.days | int(0)) * 86400 +
      (in_duration.hours | int(0)) * 3600 +
      (in_duration.minutes | int(0)) * 60 +
      (in_duration.seconds | int(0))
    }}

  elapsed_seconds: "{{ (now_ts - start_ts) | int(0) }}"

  is_in_window: >-
    {{
      (elapsed_seconds | int(0)) >= 0 and
      (
        (in_run_forever | bool(false)) or
        ((elapsed_seconds | int(0)) <= (duration_seconds | int(0)))
      )
    }}

  is_due_now: >-
    {{
      (elapsed_seconds | int(0)) >= 0 and
      ((elapsed_seconds | int(0)) % (frequency_seconds_effective | int(1)) < 60)
    }}

condition:
  - condition: template
    value_template: "{{ is_in_window and is_due_now }}"

action:
  - variables:
      scheduled_ts: >-
        {{
          (start_ts | int(0)) +
          (((elapsed_seconds | int(0)) // (frequency_seconds_effective | int(1))) * (frequency_seconds_effective | int(1)))
        }}
      scheduled_label: "{{ scheduled_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
      notification_tag: >-
        mednotify_{{ this.entity_id | replace('.', '_') }}_{{ (scheduled_ts | int(0)) }}
      action_taken: >-
        MEDNOTIFY_TAKEN_{{ this.entity_id | replace('.', '_') }}_{{ (scheduled_ts | int(0)) }}
      timeout_seconds: >-
        {{
          (in_timeout.days | int(0)) * 86400 +
          (in_timeout.hours | int(0)) * 3600 +
          (in_timeout.minutes | int(0)) * 60 +
          (in_timeout.seconds | int(0))
        }}
      timeout_active: "{{ (timeout_seconds | int(0)) > 0 }}"
      notification_data_payload: >-
        {% set payload = {
          'tag': notification_tag,
          'group': 'mednotify',
          'sticky': in_android_sticky,
          'persistent': in_android_persistent,
          'actions': [{'action': action_taken, 'title': in_taken_label}]
        } %}
        {% if (in_android_channel | string | trim) != '' %}
          {% set payload = dict(payload, channel=(in_android_channel | string | trim)) %}
        {% endif %}
        {% if (in_android_priority | string | trim) != '' %}
          {% set payload = dict(payload, priority=(in_android_priority | string | trim)) %}
        {% endif %}
        {% if (in_android_ttl | string | trim) != '' %}
          {% set payload = dict(payload, ttl=(in_android_ttl | int(0))) %}
        {% endif %}
        {% set push = {} %}
        {% if (in_ios_interruption_level | string | trim) != '' %}
          {% set push = dict(push, interruption_level=(in_ios_interruption_level | string | trim)) %}
        {% endif %}
        {% if (in_ios_sound | string | trim) != '' %}
          {% set push = dict(push, sound=(in_ios_sound | string | trim)) %}
        {% endif %}
        {% if push | length > 0 %}
          {% set payload = dict(payload, push=push) %}
        {% endif %}
        {{ payload | to_json }}
      message_body: >-
        Person: {{ in_person }}
        Medication: {{ in_medication }}
        Dose: {{ in_dose }}
        Scheduled: {{ scheduled_label }}

  - condition: template
    value_template: >-
      {{
        (in_notify_group_id | string | trim) != '' or
        (
          in_notify_devices.device_id is defined and
          (in_notify_devices.device_id | count > 0)
        )
      }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
        sequence:
          - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
            continue_on_error: true
            data:
              title: "{{ in_title }}"
              message: "{{ message_body }}"
              data: "{{ notification_data_payload | from_json }}"
    default:
      - action: notify.notify
        continue_on_error: true
        target: !input notify_devices
        data:
          title: "{{ in_title }}"
          message: "{{ message_body }}"
          data: "{{ notification_data_payload | from_json }}"

  - choose:
      - conditions:
          - condition: template
        value_template: "{{ timeout_active | bool(false) }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_taken }}"
            timeout:
              seconds: "{{ timeout_seconds | int(0) }}"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is not none }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
                        sequence:
                          - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
                            continue_on_error: true
                            data:
                              message: clear_notification
                              data:
                                tag: "{{ notification_tag }}"
                    default:
                      - action: notify.notify
                        continue_on_error: true
                        target: !input notify_devices
                        data:
                          message: clear_notification
                          data:
                            tag: "{{ notification_tag }}"
                  - sequence: !input acknowledgement_actions
            default:
              - sequence: !input timeout_actions
    default:
      - wait_for_trigger:
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_taken }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
            sequence:
              - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
                continue_on_error: true
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"
        default:
          - action: notify.notify
            continue_on_error: true
            target: !input notify_devices
            data:
              message: clear_notification
              data:
                tag: "{{ notification_tag }}"
      - sequence: !input acknowledgement_actions
