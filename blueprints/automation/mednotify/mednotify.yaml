blueprint:
  name: "💊 Medication Notification"
  description: |
    <h3>💊 Medication Notification <code>v1.0.0</code></h3>
    🔗<a href="https://github.com/lePuffin/MedNotify"> Github Link</a>
    <hr>

    <b>Features:</b>
    - Fixed-time medication schedule.
    - Device picker target selection.
    - Notification Group ID override.
    - Actionable Taken button.
    - Optional timeout flow.
    - Optional helper/action hooks.

  domain: automation
  source_url: https://raw.githubusercontent.com/lePuffin/MedNotify/main/blueprints/automation/mednotify/mednotify_v100.yaml
  input:
    section_pill:
      name: "Medication Appointment"
      description: 'Medication schedule setup.'
      icon: mdi:medical-bag
      collapsed: true
      input:
        person:
          name: "👤 Person"
          description: |
            Pick a Home Assistant person entity or type a custom name.
            The choice label below tells the blueprint which input to use.

            <b>Example:</b> Joana
          default:
            active_choice: Person Entity
          selector:
            choose:
              choices:
                Person Entity:
                  selector:
                    entity:
                      filter:
                        - domain: person
                Custom Name:
                  selector:
                    text:

        medication:
          name: "🩺 Medication"
          description: |
            Medication name.

            <b>Example:</b> Amoxicillin
          selector:
            text:

        dose:
          name: "⚗️ Dose"
          description: |
            Dose or instructions shown in the notification.

            <b>Example:</b> 1 capsule after meal
          selector:
            text:

        start_datetime:
          name: "📆 Start date and time"
          description: |
            Date/time of the first reminder.

            Start now anchors from when this automation was enabled.
            Next 15 minutes starts at the next :15, :30 or :00 boundary.
            Next half hour starts at the next :30 or :00 boundary.
            Next hour starts at the next :00 boundary.

            <b>Example:</b> 2026-08-10 08:00
          default:
            active_choice: Preset
            Preset: Start now
          selector:
            choose:
              choices:
                Preset:
                  selector:
                    select:
                      options:
                        - Start now
                        - Next 15 minutes
                        - Next half hour
                        - Next hour
                      mode: dropdown

                Specify:
                  selector:
                    datetime:

        frequency:
          name: "🕜 Reminder interval"
          description: |
            Take the pill every chosen hours.
          default:
            active_choice: Preset
            Preset: Every 8 hours
          selector:
            choose:
              choices:
                Preset:
                  selector:
                    select:
                      options:
                        - Every 8 hours
                        - Every 12 hours
                        - Once every day
                      mode: dropdown
                Specify:
                  selector:
                    duration:
                      enable_day: true
                      enable_second: false

        schedule_end:
          name: "📋 Schedule end"
          description: |
            Pick how long reminders should run, or specify an end date.
          default:
            active_choice: Preset
            Preset: Forever
          selector:
            choose:
              choices:
                Preset:
                  selector:
                    select:
                      options:
                        - Forever
                        - After 1 day
                        - After 3 days
                        - After 7 days
                      mode: dropdown
                Specify:
                  selector:
                    date:

    section_notifications:
      name: "Notifications"
      description: >-
        Delivery and mobile-platform options.
      icon: mdi:message-badge-outline
      collapsed: true
      input:
        notify_devices:
          name: "📲 Device to Notify"
          description: |
            Device target for notifications.
            Pick one or more mobile app devices from the dropdown.

            <b>Example:</b> Alex iPhone, Pixel 9
          selector:
            device:
              filter:
              - integration: mobile_app
              multiple: false

        notify_group_id:
          name: "🔖 Notification Group ID"
          description: |
            If set, this overrides Device to Notify.
            Enter only the group id (without notify.).

            <b>Example:</b> family_phones
            `Optional`
          default: ""
          selector:
            text:

        title:
          name: "🪪 Notification title"
          description: |
            Main title shown in the reminder.

            <b>Example:</b> Medication Reminder
          default: Medication Reminder
          selector:
            text:

        taken_label:
          name: "✅ Confirmation button label"
          description: |
            Label used by the action button.
            
            <b>Example:</b> Taken
          default: Taken
          selector:
            text:

        notification_message:
          name: "💬 Notification message"
          description: |
            Custom message template.
            Leave empty to use the default multi-line message.

            Supported placeholders:
            - {person}
            - {dose}
            - {medicine}
            - {expected_time}
            - {next_expected_time}
            - {pill_amount}
            - {frequency}
            - {start_time}
            - {title}
            - {taken_label}

            `Optional`
          default: ""
          selector:
            select:
              custom_value: true
              mode: dropdown
              options:
                - ""
                - "Has {person} took {dose} of {medicine} at {expected_time}?"
                - "Reminder for {person}: take {dose} of {medicine} now. Next dose at {next_expected_time}."
                - "{person} should take {pill_amount} pill(s) of {medicine} at {expected_time}."

        timeout:
          name: "🩻 Timeout duration"
          description: |
            Use 00:00:00 to disable timeout handling.

            <b>Example:</b> 1 hour
            `Optional`
          default:
            hours: 1
            minutes: 0
            seconds: 0
          selector:
            duration:

        notification_lead_time:
          name: "⏪ Notification lead time"
          description: |
            Send the reminder some time before the expected dose time.

            `Optional`
          default:
            active_choice: Preset
            Preset: On time
          selector:
            choose:
              choices:
                Preset:
                  selector:
                    select:
                      options:
                        - On time
                        - 5 minutes before
                        - 10 minutes before
                        - 15 minutes before
                        - 30 minutes before
                      mode: dropdown
                Specify:
                  selector:
                    time:

        notification_platform:
          name: "⚖️ Notification platform"
          description: |
            Select the mobile platform for this automation.

            `Optional`
          default: Android
          selector:
            select:
              options:
                - Android
                - iOS
              mode: list

        android_channel:
          name: "📡 Android channel"
          description: |
            Android notification channel.

            <b>Example:</b> medication_alerts
            `Optional`
          default: ""
          selector:
            text:

        android_priority:
          name: "⚠️ Android priority"
          description: |
            Android notification priority.

            <b>Example:</b> high
            `Optional`
          default: "normal"
          selector:
            select:
              custom_value: true
              options:
                - normal
                - high

        android_ttl:
          name: "⏱️ Android TTL in seconds"
          description: |
            Android push time-to-live in seconds.

            <b>Example:</b> 0
            `Optional`
          default: "0"
          selector:
            text:

        android_sticky:
          name: "📌 Android sticky"
          description: |
            Keep the notification visible until user interaction.

            `Optional`
          default: true
          selector:
            boolean:

        android_persistent:
          name: "🧷 Android persistent"
          description: |
            Keep the notification persistent on Android.

            `Optional`
          default: true
          selector:
            boolean:

        ios_interruption_level:
          name: "🚨 iOS interruption level"
          description: |
            iOS interruption level for push notifications.

            <b>Example:</b> time-sensitive
            `Optional`
          default: "time-sensitive"
          selector:
            select:
              custom_value: true
              options:
                - passive
                - active
                - time-sensitive
                - critical

        ios_sound:
          name: "🔔 iOS sound"
          description: |
            iOS notification sound.

            <b>Example:</b> default
            `Optional`
          default: "default"
          selector:
            text:

    section_helpers:
      name: "Helpers (optional)"
      description: >-
        User-managed helper or action hooks.
      icon: mdi:invoice-text-fast-outline
      collapsed: true
      input:
        acknowledgement_actions:
          name: "📈 Acknowledgement actions"
          description: |
            Runs when Taken is pressed.

            <b>Example action:</b>
              ```yaml
              service: input_text.set_value
              target:
                entity_id: input_text.mednotify_ack_history
              data:
                value: >-
                  {% set timestamp = now().strftime('%Y-%m-%d %H:%M') %}
                  {{ timestamp }} | {{ person_name }} took {{ in_dose }} of {{ in_medication }}
              ```
            `Optional`
          default: []
          selector:
            action: {}

        timeout_actions:
          name: "📉 Timeout actions"
          description: |
            Runs when timeout is reached.

            <b>Example action:</b>
              ```yaml
              service: input_text.set_value
              target:
                entity_id: input_text.mednotify_timeout_history
              data:
                value: >-
                  {% set timestamp = now().strftime('%Y-%m-%d %H:%M') %}
                  {{ timestamp }} | Timeout reached for {{ person_name }}'s reminder
              ```
            `Optional`
          default: []
          selector:
            action: {}

mode: parallel
max: 100

trigger_variables:
  trig_start_datetime: !input start_datetime
  trig_frequency: !input frequency
  trig_schedule_end: !input schedule_end
  trig_notification_lead_time: !input notification_lead_time

trigger:
  - platform: template
    value_template: >-
      {% set in_start_datetime = trig_start_datetime %}
      {% set in_frequency = trig_frequency %}
      {% set in_schedule_end = trig_schedule_end %}
      {% set in_notification_lead_time = trig_notification_lead_time %}

      {% set now_ts = as_timestamp(now()) | float(0) %}
      {% set automation_entity_id = this.entity_id if this is defined else '' %}
      {% set automation_enabled_ts =
        (as_timestamp(states[automation_entity_id].last_changed) | float(0))
        if (automation_entity_id | string | trim) != ''
        else (now_ts | float(0))
      %}

      {% set start_datetime_mode = in_start_datetime.active_choice if in_start_datetime is mapping else 'Preset' %}
      {% set start_datetime_choice =
        in_start_datetime['Preset']
        if (start_datetime_mode == 'Preset' and in_start_datetime is mapping and 'Preset' in in_start_datetime)
        else 'Specify date-time'
      %}

      {% set next_hour_ts = ((((automation_enabled_ts | int(0)) // 3600) + 1) * 3600) | int(0) %}
      {% set next_quarter_hour_ts = ((((automation_enabled_ts | int(0)) // 900) + 1) * 900) | int(0) %}
      {% set next_half_hour_ts = ((((automation_enabled_ts | int(0)) // 1800) + 1) * 1800) | int(0) %}

      {% if start_datetime_choice == 'Next 15 minutes' %}
        {% set preset_start_ts = next_quarter_hour_ts | int(0) %}
      {% elif start_datetime_choice == 'Next hour' %}
        {% set preset_start_ts = next_hour_ts | int(0) %}
      {% elif start_datetime_choice == 'Next half hour' %}
        {% set preset_start_ts = next_half_hour_ts | int(0) %}
      {% else %}
        {% set preset_start_ts = as_timestamp(now()) | int(0) %}
      {% endif %}

      {% if start_datetime_mode == 'Specify' %}
        {% set start_specify = in_start_datetime['Specify'] if (in_start_datetime is mapping and 'Specify' in in_start_datetime) else now() %}
        {% set start_ts = as_timestamp(start_specify) | float(0) %}
      {% else %}
        {% set start_ts = preset_start_ts | float(0) %}
      {% endif %}

      {% set notification_lead_mode = in_notification_lead_time.active_choice if in_notification_lead_time is mapping else 'Preset' %}
      {% set notification_lead_choice =
        in_notification_lead_time['Preset']
        if (notification_lead_mode == 'Preset' and in_notification_lead_time is mapping and 'Preset' in in_notification_lead_time)
        else 'Specify'
      %}

      {% if notification_lead_choice == 'On time' %}
        {% set notification_lead_seconds = 0 %}
      {% elif notification_lead_choice == '5 minutes before' %}
        {% set notification_lead_seconds = 300 %}
      {% elif notification_lead_choice == '10 minutes before' %}
        {% set notification_lead_seconds = 600 %}
      {% elif notification_lead_choice == '15 minutes before' %}
        {% set notification_lead_seconds = 900 %}
      {% elif notification_lead_choice == '30 minutes before' %}
        {% set notification_lead_seconds = 1800 %}
      {% elif notification_lead_choice == 'Specify' %}
        {% set raw_lead_time = in_notification_lead_time['Specify'] if (in_notification_lead_time is mapping and 'Specify' in in_notification_lead_time) else '00:00:00' %}
        {% set lead_time = (raw_lead_time | string).split(':') %}
        {% set notification_lead_seconds =
          (lead_time[0] | int(0)) * 3600 +
          (lead_time[1] | int(0)) * 60 +
          (lead_time[2] | int(0))
        %}
      {% else %}
        {% set notification_lead_seconds = 0 %}
      {% endif %}

      {% set first_notification_ts = (start_ts | float(0)) - (notification_lead_seconds | int(0)) %}
      {% set lead_points_to_past_first_cycle =
        (notification_lead_seconds | int(0)) > 0 and
        (now_ts | float(0)) < (start_ts | float(0)) and
        (now_ts | float(0)) > (first_notification_ts | float(0))
      %}
      {% set effective_notification_lead_seconds = 0 if lead_points_to_past_first_cycle else (notification_lead_seconds | int(0)) %}

      {% set frequency_mode = in_frequency.active_choice if in_frequency is mapping else 'Preset' %}
      {% set frequency_choice =
        in_frequency['Preset']
        if (frequency_mode == 'Preset' and in_frequency is mapping and 'Preset' in in_frequency)
        else 'Free'
      %}

      {% if frequency_choice == 'Every 8 hours' %}
        {% set frequency_seconds_raw = 28800 %}
      {% elif frequency_choice == 'Every 12 hours' %}
        {% set frequency_seconds_raw = 43200 %}
      {% elif frequency_choice == 'Once every day' %}
        {% set frequency_seconds_raw = 86400 %}
      {% elif frequency_choice == 'Free' %}
        {% set duration_value = in_frequency['Free'] if (in_frequency is mapping and 'Free' in in_frequency) else {} %}
        {% set frequency_seconds_raw =
          ((duration_value['days'] if 'days' in duration_value else 0) | int(0)) * 86400 +
          ((duration_value['hours'] if 'hours' in duration_value else 0) | int(0)) * 3600 +
          ((duration_value['minutes'] if 'minutes' in duration_value else 0) | int(0)) * 60 +
          ((duration_value['seconds'] if 'seconds' in duration_value else 0) | int(0))
        %}
      {% else %}
        {% set frequency_seconds_raw = 28800 %}
      {% endif %}

      {% set frequency_seconds_effective = 86400 if (frequency_seconds_raw | int(0)) == 0 else (frequency_seconds_raw | int(0)) %}

      {% set schedule_end_mode = in_schedule_end.active_choice if in_schedule_end is mapping else 'Preset' %}
      {% set schedule_end_choice =
        in_schedule_end['Preset']
        if (schedule_end_mode == 'Preset' and in_schedule_end is mapping and 'Preset' in in_schedule_end)
        else 'Specify'
      %}

      {% if schedule_end_choice == 'After 1 day' %}
        {% set schedule_end_seconds = 86400 %}
      {% elif schedule_end_choice == 'After 3 days' %}
        {% set schedule_end_seconds = 259200 %}
      {% elif schedule_end_choice == 'After 7 days' %}
        {% set schedule_end_seconds = 604800 %}
      {% else %}
        {% set schedule_end_seconds = 0 %}
      {% endif %}

      {% if schedule_end_choice in ['After 1 day', 'After 3 days', 'After 7 days'] %}
        {% set schedule_end_ts = (start_ts | float(0)) + (schedule_end_seconds | int(0)) %}
      {% elif schedule_end_choice == 'Specify' %}
        {% set schedule_end_date = in_schedule_end['Specify'] if (in_schedule_end is mapping and 'Specify' in in_schedule_end) else now().strftime('%Y-%m-%d') %}
        {% set schedule_end_ts = as_timestamp((schedule_end_date ~ ' 23:59:59')) | float(0) %}
      {% else %}
        {% set schedule_end_ts = 0 %}
      {% endif %}

      {% set elapsed_seconds = (now_ts - start_ts) | int(0) %}
      {% set adjusted_elapsed_seconds = (elapsed_seconds | int(0)) + (effective_notification_lead_seconds | int(0)) %}

      {% set is_in_window =
        (adjusted_elapsed_seconds | int(0)) >= 0 and
        (
          (schedule_end_choice == 'Forever') or
          ((now_ts | float(0)) <= (schedule_end_ts | float(0)))
        )
      %}

      {% set is_due_now =
        (adjusted_elapsed_seconds | int(0)) >= 0 and
        ((adjusted_elapsed_seconds | int(0)) % (frequency_seconds_effective | int(1)) < 60)
      %}

      {{ is_in_window and is_due_now }}

variables:
  in_person: !input person
  in_medication: !input medication
  in_dose: !input dose
  in_start_datetime: !input start_datetime
  in_frequency: !input frequency
  in_schedule_end: !input schedule_end
  in_notify_devices: !input notify_devices
  in_notify_group_id: !input notify_group_id
  in_title: !input title
  in_taken_label: !input taken_label
  in_notification_message: !input notification_message
  in_timeout: !input timeout
  in_notification_lead_time: !input notification_lead_time
  in_notification_platform: !input notification_platform
  in_android_channel: !input android_channel
  in_android_priority: !input android_priority
  in_android_ttl: !input android_ttl
  in_android_sticky: !input android_sticky
  in_android_persistent: !input android_persistent
  in_ios_interruption_level: !input ios_interruption_level
  in_ios_sound: !input ios_sound

  person_name: >-
    {% if in_person is mapping %}
      {% set person_choice = in_person.active_choice | default('Person Entity') %}
      {% if person_choice == 'Person Entity' %}
        {% set person_entity = in_person['Person Entity'] if 'Person Entity' in in_person else (in_person.entity if in_person.entity is defined else '') %}
        {{ state_attr(person_entity, 'friendly_name') or person_entity }}
      {% else %}
        {{ in_person['Custom Name'] if 'Custom Name' in in_person else (in_person.text if in_person.text is defined else '') }}
      {% endif %}
    {% else %}
      {{ in_person }}
    {% endif %}

  notification_platform_choice: >-
    {{ in_notification_platform | string }}

  notify_device_id: >-
    {% set raw_device = in_notify_devices %}
    {{
      raw_device[0]
      if (raw_device is sequence and raw_device is not string and (raw_device | length) > 0)
      else raw_device
    }}

  notify_device_service: >-
    {% set device_id = notify_device_id | string | trim %}
    {% set mobile_entity =
      (
        device_entities(device_id)
        | select('match', '^notify\\.mobile_app_')
        | list
        | first
        | default('')
      )
      if device_id != ''
      else ''
    %}
    {% set device_name =
      (device_attr(device_id, 'name_by_user') or device_attr(device_id, 'name') or '')
      if device_id != ''
      else ''
    %}
    {% set fallback_service =
      ('notify.mobile_app_' ~ (device_name | slugify))
      if (device_name | string | trim) != ''
      else ''
    %}
    {{
      mobile_entity
      if (mobile_entity | string | trim) != ''
      else fallback_service
    }}

  start_datetime_mode: >-
    {{ in_start_datetime.active_choice if in_start_datetime is mapping else 'Preset' }}

  start_datetime_choice: >-
    {% if start_datetime_mode == 'Preset' %}
      {{ in_start_datetime['Preset'] if (in_start_datetime is mapping and 'Preset' in in_start_datetime) else 'Start now' }}
    {% else %}
      Specify date-time
    {% endif %}

  automation_enabled_ts: >-
    {% set automation_entity_id = this.entity_id if this is defined else '' %}
    {{
      (as_timestamp(states[automation_entity_id].last_changed) | float(0))
      if (automation_entity_id | string | trim) != ''
      else (as_timestamp(now()) | float(0))
    }}

  next_hour_ts: "{{ ((((automation_enabled_ts | int(0)) // 3600) + 1) * 3600) | int(0) }}"
  next_quarter_hour_ts: "{{ ((((automation_enabled_ts | int(0)) // 900) + 1) * 900) | int(0) }}"
  next_half_hour_ts: "{{ ((((automation_enabled_ts | int(0)) // 1800) + 1) * 1800) | int(0) }}"

  preset_start_ts: >-
    {% if start_datetime_choice == 'Next 15 minutes' %}
      {{ next_quarter_hour_ts | int(0) }}
    {% elif start_datetime_choice == 'Next hour' %}
      {{ next_hour_ts | int(0) }}
    {% elif start_datetime_choice == 'Next half hour' %}
      {{ next_half_hour_ts | int(0) }}
    {% else %}
      {{ as_timestamp(now()) | int(0) }}
    {% endif %}

  notification_lead_mode: >-
    {{ in_notification_lead_time.active_choice if in_notification_lead_time is mapping else 'Preset' }}

  notification_lead_choice: >-
    {% if notification_lead_mode == 'Preset' %}
      {{ in_notification_lead_time['Preset'] if (in_notification_lead_time is mapping and 'Preset' in in_notification_lead_time) else 'On time' }}
    {% else %}
      Specify
    {% endif %}

  notification_lead_seconds: >-
    {% if notification_lead_choice == 'On time' %}
      0
    {% elif notification_lead_choice == '5 minutes before' %}
      300
    {% elif notification_lead_choice == '10 minutes before' %}
      600
    {% elif notification_lead_choice == '15 minutes before' %}
      900
    {% elif notification_lead_choice == '30 minutes before' %}
      1800
    {% elif notification_lead_choice == 'Specify' %}
      {% set raw_lead_time = in_notification_lead_time['Specify'] if (in_notification_lead_time is mapping and 'Specify' in in_notification_lead_time) else '00:00:00' %}
      {% set lead_time = (raw_lead_time | string).split(':') %}
      {{
        (lead_time[0] | int(0)) * 3600 +
        (lead_time[1] | int(0)) * 60 +
        (lead_time[2] | int(0))
      }}
    {% else %}
      0
    {% endif %}

  start_ts: >-
    {% if start_datetime_mode == 'Specify' %}
      {% set start_specify = in_start_datetime['Specify'] if (in_start_datetime is mapping and 'Specify' in in_start_datetime) else now() %}
      {{ as_timestamp(start_specify) | float(0) }}
    {% else %}
      {{ preset_start_ts | float(0) }}
    {% endif %}
  now_ts: "{{ as_timestamp(now()) | float(0) }}"

  frequency_mode: >-
    {{ in_frequency.active_choice if in_frequency is mapping else 'Preset' }}

  frequency_choice: >-
    {% if frequency_mode == 'Preset' %}
      {{ in_frequency['Preset'] if (in_frequency is mapping and 'Preset' in in_frequency) else 'Every 8 hours' }}
    {% else %}
      Free
    {% endif %}

  frequency_seconds_raw: >-
    {% if frequency_choice == 'Every 8 hours' %}
      28800
    {% elif frequency_choice == 'Every 12 hours' %}
      43200
    {% elif frequency_choice == 'Once every day' %}
      86400
    {% elif frequency_choice == 'Free' %}
      {% set duration_value = in_frequency['Free'] if (in_frequency is mapping and 'Free' in in_frequency) else {} %}
      {{
        ((duration_value['days'] if 'days' in duration_value else 0) | int(0)) * 86400 +
        ((duration_value['hours'] if 'hours' in duration_value else 0) | int(0)) * 3600 +
        ((duration_value['minutes'] if 'minutes' in duration_value else 0) | int(0)) * 60 +
        ((duration_value['seconds'] if 'seconds' in duration_value else 0) | int(0))
      }}
    {% else %}
      28800
    {% endif %}

  frequency_seconds_effective: >-
    {{ 86400 if (frequency_seconds_raw | int(0)) == 0 else (frequency_seconds_raw | int(0)) }}

  schedule_end_mode: >-
    {{ in_schedule_end.active_choice if in_schedule_end is mapping else 'Preset' }}

  schedule_end_choice: >-
    {% if schedule_end_mode == 'Preset' %}
      {{ in_schedule_end['Preset'] if (in_schedule_end is mapping and 'Preset' in in_schedule_end) else 'Forever' }}
    {% else %}
      Specify
    {% endif %}

  schedule_end_seconds: >-
    {% if schedule_end_choice == 'After 1 day' %}
      86400
    {% elif schedule_end_choice == 'After 3 days' %}
      259200
    {% elif schedule_end_choice == 'After 7 days' %}
      604800
    {% else %}
      0
    {% endif %}

  schedule_end_ts: >-
    {% if schedule_end_choice in ['After 1 day', 'After 3 days', 'After 7 days'] %}
      {{ (start_ts | float(0)) + (schedule_end_seconds | int(0)) }}
    {% elif schedule_end_choice == 'Specify' %}
      {% set schedule_end_date = in_schedule_end['Specify'] if (in_schedule_end is mapping and 'Specify' in in_schedule_end) else now().strftime('%Y-%m-%d') %}
      {{ as_timestamp((schedule_end_date ~ ' 23:59:59')) | float(0) }}
    {% else %}
      0
    {% endif %}

  elapsed_seconds: "{{ (now_ts - start_ts) | int(0) }}"
  first_notification_ts: "{{ (start_ts | float(0)) - (notification_lead_seconds | int(0)) }}"

  lead_points_to_past_first_cycle: >-
    {{
      (notification_lead_seconds | int(0)) > 0 and
      (now_ts | float(0)) < (start_ts | float(0)) and
      (now_ts | float(0)) > (first_notification_ts | float(0))
    }}

  effective_notification_lead_seconds: >-
    {{ 0 if lead_points_to_past_first_cycle else (notification_lead_seconds | int(0)) }}

  adjusted_elapsed_seconds: "{{ (elapsed_seconds | int(0)) + (effective_notification_lead_seconds | int(0)) }}"

  is_in_window: >-
    {{
      (adjusted_elapsed_seconds | int(0)) >= 0 and
      (
        (schedule_end_choice == 'Forever') or
        ((now_ts | float(0)) <= (schedule_end_ts | float(0)))
      )
    }}

  is_due_now: >-
    {{
      (adjusted_elapsed_seconds | int(0)) >= 0 and
      ((adjusted_elapsed_seconds | int(0)) % (frequency_seconds_effective | int(1)) < 60)
    }}

action:
  - condition: template
    value_template: "{{ is_in_window and is_due_now }}"

  - variables:
      scheduled_ts: >-
        {{
          (start_ts | int(0)) +
          (((adjusted_elapsed_seconds | int(0)) // (frequency_seconds_effective | int(1))) * (frequency_seconds_effective | int(1)))
        }}
      scheduled_label: "{{ scheduled_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
      notification_tag: >-
        mednotify_{{ this.entity_id | replace('.', '_') }}_{{ (scheduled_ts | int(0)) }}
      action_taken: >-
        MEDNOTIFY_TAKEN_{{ this.entity_id | replace('.', '_') }}_{{ (scheduled_ts | int(0)) }}
      timeout_seconds: >-
        {% set timeout_value = in_timeout if in_timeout is mapping else {} %}
        {{
          ((timeout_value['days'] if 'days' in timeout_value else 0) | int(0)) * 86400 +
          ((timeout_value['hours'] if 'hours' in timeout_value else 0) | int(0)) * 3600 +
          ((timeout_value['minutes'] if 'minutes' in timeout_value else 0) | int(0)) * 60 +
          ((timeout_value['seconds'] if 'seconds' in timeout_value else 0) | int(0))
        }}
      timeout_active: "{{ (timeout_seconds | int(0)) > 0 }}"
      next_scheduled_ts: "{{ (scheduled_ts | int(0)) + (frequency_seconds_effective | int(0)) }}"
      next_scheduled_label: "{{ next_scheduled_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
      start_label: "{{ start_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
      pill_amount: >-
        {% set dose_text = in_dose | string | trim %}
        {% set first_part = (dose_text.split(' ')[0] if dose_text != '' else '') %}
        {{ first_part }}
      notification_data_payload: >-
        {% set payload = {
          'tag': notification_tag,
          'group': 'mednotify',
          'actions': [{'action': action_taken, 'title': in_taken_label}]
        } %}
        {% if notification_platform_choice == 'Android' %}
          {% set payload = dict(payload, sticky=in_android_sticky, persistent=in_android_persistent) %}
          {% if (in_android_channel | string | trim) != '' %}
            {% set payload = dict(payload, channel=(in_android_channel | string | trim)) %}
          {% endif %}
          {% if (in_android_priority | string | trim) != '' %}
            {% set payload = dict(payload, priority=(in_android_priority | string | trim)) %}
          {% endif %}
          {% if (in_android_ttl | string | trim) != '' %}
            {% set payload = dict(payload, ttl=(in_android_ttl | int(0))) %}
          {% endif %}
        {% elif notification_platform_choice == 'iOS' %}
          {% set push = {} %}
          {% if (in_ios_interruption_level | string | trim) != '' %}
            {% set push = dict(push, interruption_level=(in_ios_interruption_level | string | trim)) %}
          {% endif %}
          {% if (in_ios_sound | string | trim) != '' %}
            {% set push = dict(push, sound=(in_ios_sound | string | trim)) %}
          {% endif %}
          {% if push | length > 0 %}
            {% set payload = dict(payload, push=push) %}
          {% endif %}
        {% endif %}
        {{ payload | to_json }}
      message_body: >-
        {% if (in_notification_message | string | trim) == '' %}
          Person: {{ person_name }}
          Medication: {{ in_medication }}
          Dose: {{ in_dose }}
          Scheduled: {{ scheduled_label }}
        {% else %}
          {{
            (in_notification_message | string)
            | replace('{person}', person_name | string)
            | replace('{dose}', in_dose | string)
            | replace('{medice dose}', in_dose | string)
            | replace('{medicine dose}', in_dose | string)
            | replace('{medicine}', in_medication | string)
            | replace('{medicine name}', in_medication | string)
            | replace('{expected_time}', scheduled_label | string)
            | replace('{next_expected_time}', next_scheduled_label | string)
            | replace('{next_time}', next_scheduled_label | string)
            | replace('{pill_amount}', pill_amount | string)
            | replace('{pill_count}', pill_amount | string)
            | replace('{frequency}', frequency_choice | string)
            | replace('{start_time}', start_label | string)
            | replace('{title}', in_title | string)
            | replace('{taken_label}', in_taken_label | string)
          }}
        {% endif %}

  - condition: template
    value_template: >-
      {{
        (in_notify_group_id | string | trim) != '' or
        ((notify_device_id | string | trim) != '')
      }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
        sequence:
          - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
            continue_on_error: true
            data:
              title: "{{ in_title }}"
              message: "{{ message_body }}"
              data: "{{ notification_data_payload | from_json }}"
    default:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (notify_device_service | string | trim) != '' }}"
            sequence:
              - action: "{{ notify_device_service }}"
                continue_on_error: true
                data:
                  title: "{{ in_title }}"
                  message: "{{ message_body }}"
                  data: "{{ notification_data_payload | from_json }}"

  - choose:
      - conditions: "{{ timeout_active | bool(false) }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_taken }}"
            timeout:
              seconds: "{{ timeout_seconds | int(0) }}"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is not none }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
                        sequence:
                          - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
                            continue_on_error: true
                            data:
                              message: clear_notification
                              data:
                                tag: "{{ notification_tag }}"
                    default:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ (notify_device_service | string | trim) != '' }}"
                            sequence:
                              - action: "{{ notify_device_service }}"
                                continue_on_error: true
                                data:
                                  message: clear_notification
                                  data:
                                    tag: "{{ notification_tag }}"
                  - sequence: !input acknowledgement_actions
            default:
              - sequence: !input timeout_actions
    default:
      - wait_for_trigger:
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_taken }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (in_notify_group_id | string | trim) != '' }}"
            sequence:
              - action: "{{ 'notify.' ~ (in_notify_group_id | string | trim) }}"
                continue_on_error: true
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"
        default:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (notify_device_service | string | trim) != '' }}"
                sequence:
                  - action: "{{ notify_device_service }}"
                    continue_on_error: true
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notification_tag }}"
      - sequence: !input acknowledgement_actions
